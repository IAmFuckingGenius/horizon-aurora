[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
# The entry points Android and the JVM look up by name; the launcher and the game are
# horizon-client's (src/android_host.rs).
path = "src/lib.rs"

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
jni = "0.21"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[features]
# WebAssembly code mods (`mods`) no longer run: Horizon dropped them; content mods and the
# built-in native mods still do.
default = ["audio"]
audio = ["horizon-client/audio"]
controllers = []
mods = ["horizon-client/mods"]

[lints]
workspace = true
