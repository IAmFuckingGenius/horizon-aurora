# Botania for Horizon Aurora: a modified port of Vazkii's Botania mechanics (Botania License, see
# LICENSE and NOTICE.md). A horizon-mixins bundle: named hook points only (NATIVE_HOOKS_API 415 has
# them all), the game-side module `botania` in game.rs, and the mechanics in the `core` crate.
# Blocks, items, textures and recipes come from the Botania content mod (.hmod).
[mod]
id = "botania"
version = "0.1.0"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "botania"
source = "runtime.rs"

[[crate]]
id = "core"
path = "core"

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update_tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "level_tick"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "has_output"
hook = "has_analog_output"
hook_version = 1
kind = "HEAD"
helper = "has_output.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "output", ty = "&mut bool", value = "&mut *output" },
]

[[injection]]
id = "output"
hook = "analog_output"
hook_version = 1
kind = "HEAD"
helper = "output.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "output", ty = "&mut i32", value = "&mut *output" },
]

[[injection]]
id = "data"
hook = "data_pack_files"
hook_version = 1
kind = "HEAD"
helper = "data.rs"
bindings = [
  { name = "files", ty = "&mut Vec<(String, Vec<u8>)>", value = "&mut *files" },
]

[[injection]]
id = "placed"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "placed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "use_on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "use_item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "right_click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# ---- block entity renderers (`botania_render`, renderers.rs) ----------------------------------
# Botania's `ManaPoolBlockEntityRenderer`, `PetalApothecaryBlockEntityRenderer` and
# `ManaSpreaderBlockEntityRenderer`, drawn with `native_block_entity_submit`.

[[module]]
id = "render"
file = "crates/horizon-client/src/game.rs"
name = "botania_render"
source = "renderers.rs"

[[injection]]
id = "submit"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "models"
hook = "standalone_models"
hook_version = 1
kind = "HEAD"
helper = "models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

# Runs after `update_tag` (hooks on one site run by injection id, ascending) and adds to its tag.
[[injection]]
id = "update_tag_items"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_items.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

# ---- Botania's armour models (`botania_armour`, armour.rs) ---------------------------------------
# Manasteel, manaweave, elementium and terrasteel pieces drawn with Botania's own meshes on players
# and humanoid mobs (`native_mob_layer`); the content items wear no equipment asset.

[[module]]
id = "armour"
file = "crates/horizon-client/src/game.rs"
name = "botania_armour"
source = "armour.rs"

[[injection]]
id = "armour_listened"
hook = "player_render_listened"
hook_version = 1
kind = "HEAD"
helper = "armour_listened.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "listened", ty = "&mut bool", value = "&mut *listened" },
]

[[injection]]
id = "armour_layer"
hook = "mob_layer"
hook_version = 1
kind = "HEAD"
helper = "armour_layer.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mob", ty = "&crate::game::native_mob_draw::NativeMobRender<'_>", value = "mob" },
  { name = "who", ty = "Option<&crate::game::native_mob_draw::NativePlayerRender<'_>>", value = "who" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

