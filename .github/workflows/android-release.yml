name: Horizon Aurora release
run-name: Aurora release · ${{ github.ref_name }}

# A tag `v<versionName>` (packaging/android/build.gradle) builds the four public APKs from
# that exact commit, signs them with the Aurora release key and opens a draft release with
# the notes from docs/releases/aurora-<version>.md. Test the APKs, then press Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: The tag names the app's version and its notes exist
        id: version
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" packaging/android/build.gradle | head -n 1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in packaging/android/build.gradle"
            exit 1
          fi
          if [[ ! -s "docs/releases/aurora-$version.md" ]]; then
            echo "::error::Write the release notes first: docs/releases/aurora-$version.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Minutes since 2020 at the tagged commit: the same for every ABI, above every
          # earlier release.
          echo "version_code=$(( ($(git log -1 --format=%ct) - 1577836800) / 60 ))" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Restore the release signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.AURORA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('RELEASE_KEYSTORE', '')
          if not value:
              raise SystemExit('Set AURORA_RELEASE_KEYSTORE_BASE64 first; see docs/android-releases.md')
          path = Path('.local/android/aurora-release.jks')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        env:
          ABI: ${{ matrix.abi }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      # Reuses the dev builds' caches; a release never writes one of its own.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
            android-dev-${{ runner.os }}-${{ matrix.abi }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build, sign and audit the public APK
        env:
          ABI: ${{ matrix.abi }}
          VERSION_CODE: ${{ needs.check.outputs.version_code }}
          AURORA_RELEASE_PASSWORD: ${{ secrets.AURORA_RELEASE_PASSWORD }}
        run: |
          python3 tools/android_build.py --abi "$ABI" --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --version-code "$VERSION_CODE" --release-key .local/android/aurora-release.jks
      - name: Collect the APK and the engine
        env:
          ABI: ${{ matrix.abi }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          cp ".local/android/apk/$ABI/horizon-android-public.apk" "dist/Horizon-Aurora-$VERSION-$ABI.apk"
          # The same engine for the launcher's engine list: an older Aurora updates its
          # engine from here without reinstalling.
          python3 tools/android_engine_pack.py --abi "$ABI" --skip-build --profile release \
            --id aurora --name "Horizon Aurora $VERSION" --version "$VERSION" \
            --output "dist/Horizon-Aurora-$VERSION-$ABI.hengine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurora-release-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f .local/android/aurora-release.jks

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aurora-release-*
          path: dist
          merge-multiple: true
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp LICENSE dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum Horizon-Aurora-*.apk Horizon-Aurora-*.hengine > SHA256SUMS.txt && cat SHA256SUMS.txt)
          test "$(ls dist/Horizon-Aurora-*.apk | wc -l)" -eq 4
          test "$(ls dist/Horizon-Aurora-*.hengine | wc -l)" -eq 4
          python3 tools/android_engine_index.py --output dist/engines.json \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" dist/Horizon-Aurora-*.hengine
          # A rerun replaces its own draft; a published release is never replaced.
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; bump the version instead"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Horizon Aurora $VERSION" --notes-file "docs/releases/aurora-$VERSION.md" \
            dist/Horizon-Aurora-*.apk dist/Horizon-Aurora-*.hengine dist/engines.json \
            dist/SHA256SUMS.txt dist/LICENSE.txt dist/THIRD_PARTY_NOTICES.md
          {
            echo "### Draft release Horizon Aurora $VERSION"
            echo
            echo 'Install the APKs on a device, then publish the draft on the Releases page.'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
