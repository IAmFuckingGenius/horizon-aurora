name: Horizon Aurora dev APKs
run-name: Aurora dev · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - 'packaging/android/**'
      - 'tools/**'
      - 'mods/**'
      - 'third_party/**'
      - '.github/workflows/android-dev.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      all_abis:
        description: Also build x86 and x86_64 (ARM64 and 32-bit ARMv7 always build)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never expose a signing secret to pull requests or arbitrary dispatch refs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.all_abis && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a","armeabi-v7a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore dedicated dev signing identity
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('DEV_KEYSTORE', '')
          if not value:
              raise SystemExit('Set ANDROID_DEV_KEYSTORE_BASE64 first; see docs/android-dev-builds.md')
          path = Path('.local/android/debug.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        env:
          ABI: ${{ matrix.abi }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build optimized public dev APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 tools/android_build.py --abi "$ABI" --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$(( ($(date +%s) - 1577836800) / 60 ))"
      - name: Collect only audited APK and public metadata
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path('dist')
          out.mkdir()
          sha, abi = os.environ['GITHUB_SHA'], os.environ['ABI']
          name = f'Horizon-Aurora-dev.{os.environ["GITHUB_RUN_NUMBER"]}.{sha[:12]}-{abi}.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          (out / 'SHA256SUMS.txt').write_text(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {name}\n')
          for source, dest in [('LICENSE', 'LICENSE.txt'), ('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')]:
              shutil.copyfile(source, out / dest)
          (out / 'BUILD.json').write_text(json.dumps({'commit': sha, 'abi': abi, 'profile': 'release',
              'package': 'io.github.iamfuckinggenius.aurora.dev', 'experimental': True,
              'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Horizon Aurora dev APK: {abi}\n\nCommit: `{sha}`. Optimized release profile; experimental build.\n\n'
                  'Download it from the `dev` pre-release, or the APK artifact below. '
                  'It installs beside the Aurora release as Horizon Aurora dev and updates an installed dev build in place.\n')
          PY
      - name: Pack the engine for the launcher's engine list
        env:
          ABI: ${{ matrix.abi }}
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" packaging/android/build.gradle | head -n 1)
          python3 tools/android_engine_pack.py --abi "$ABI" --skip-build --profile release \
            --id aurora-dev --name 'Aurora Dev' --version "$version-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --output "dist/aurora-dev-$ABI.hengine"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: horizon-dev-${{ github.run_number }}-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f .local/android/debug.keystore

  publish:
    # One release, replaced by every build of main: each ABI's newest APK and engine,
    # downloadable from a phone without signing in. An ABI whose build failed is left out.
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: horizon-dev-${{ github.run_number }}-*
          path: parts
      - name: Publish the rolling dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          mkdir dist
          cp parts/*/*.apk parts/*/*.hengine dist/
          ls dist/*-arm64-v8a.apk > /dev/null
          cat parts/*/SHA256SUMS.txt | sort -k2 > dist/SHA256SUMS.txt
          notes="Automatic build of ${SHA:0:12} from main (run ${GITHUB_RUN_NUMBER}). Experimental. Most phones need arm64-v8a; old 32-bit phones armeabi-v7a. Installs beside the Aurora release (package io.github.iamfuckinggenius.aurora.dev) and updates the previous dev build in place. What the fork adds: see the README."
          # The engine list the launcher reads (Settings › Engines › Engines from Aurora).
          python3 tools/android_engine_index.py --output dist/engines.json \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/dev/" dist/*.hengine
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create dev --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "Dev build ${GITHUB_RUN_NUMBER} (${SHA:0:12})" --notes "$notes" \
            dist/*.apk dist/SHA256SUMS.txt dist/*.hengine dist/engines.json
